name: springapex

x-wordpress-environment: &wordpress-environment
  WORDPRESS_DB_HOST: database:3306
  WORDPRESS_DB_USER: ${SPRINGAPEX_DB_USER}
  WORDPRESS_DB_PASSWORD: ${SPRINGAPEX_DB_PASSWORD}
  WORDPRESS_DB_NAME: ${SPRINGAPEX_DB_NAME}
  WORDPRESS_TABLE_PREFIX: wp_
  SPRINGAPEX_SITE_URL: ${SPRINGAPEX_SITE_URL}
  SPRINGAPEX_TURNSTILE_SECRET: ${SPRINGAPEX_TURNSTILE_SECRET:-}
  WORDPRESS_CONFIG_EXTRA: |
    if (isset($$_SERVER['HTTP_X_FORWARDED_PROTO']) && str_contains((string) $$_SERVER['HTTP_X_FORWARDED_PROTO'], 'https')) {
        $$_SERVER['HTTPS'] = 'on';
    }
    $$springapex_site_url = getenv('SPRINGAPEX_SITE_URL') ?: 'https://web.norenspring.com';
    define('WP_HOME', $$springapex_site_url);
    define('WP_SITEURL', $$springapex_site_url);
    define('WP_ENVIRONMENT_TYPE', 'production');
    define('WP_DEBUG_LOG', false);
    define('WP_DEBUG_DISPLAY', false);
    define('DISALLOW_FILE_EDIT', true);
    if (getenv('SPRINGAPEX_ALLOW_FILE_MODS') !== '1') {
        define('DISALLOW_FILE_MODS', true);
    }
    define('AUTOMATIC_UPDATER_DISABLED', true);
    define('WP_MEMORY_LIMIT', '256M');
    define('WP_MAX_MEMORY_LIMIT', '384M');
    define('SPRINGAPEX_PRIVATE_UPLOADS_PROTECTED', true);
    $$springapex_turnstile_secret = getenv('SPRINGAPEX_TURNSTILE_SECRET');
    if (is_string($$springapex_turnstile_secret) && $$springapex_turnstile_secret !== '') {
        define('SPRINGAPEX_TURNSTILE_SECRET', $$springapex_turnstile_secret);
    }

services:
  database:
    image: mariadb:11.4
    restart: unless-stopped
    init: true
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --performance-schema=OFF
    environment:
      MARIADB_DATABASE: ${SPRINGAPEX_DB_NAME}
      MARIADB_USER: ${SPRINGAPEX_DB_USER}
      MARIADB_PASSWORD: ${SPRINGAPEX_DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${SPRINGAPEX_DB_ROOT_PASSWORD}
    volumes:
      - ./data/mariadb:/var/lib/mysql
    healthcheck:
      test: [CMD-SHELL, 'healthcheck.sh --connect --innodb_initialized']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  wordpress:
    image: wordpress:7.0.4-php8.3-apache
    restart: unless-stopped
    init: true
    depends_on:
      database:
        condition: service_healthy
    ports:
      - 127.0.0.1:${SPRINGAPEX_HTTP_PORT:-38100}:80
    environment: *wordpress-environment
    volumes:
      - ./wordpress:/var/www/html
      - ./php/uploads.ini:/usr/local/etc/php/conf.d/springapex-uploads.ini:ro
    healthcheck:
      test: [CMD-SHELL, 'php -r ''$$socket = @fsockopen("127.0.0.1", 80); exit($$socket ? 0 : 1);''']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 45s
    mem_limit: 640m
    security_opt:
      - no-new-privileges:true
    networks:
      - internal

  cli:
    image: wordpress:cli-php8.3
    profiles: [tools]
    user: 33:33
    depends_on:
      database:
        condition: service_healthy
    environment: *wordpress-environment
    volumes:
      - ./wordpress:/var/www/html
    networks:
      - internal

networks:
  internal:
    driver: bridge
