map $args $springapex_original_image_requested {
    default 0;
    ~*original$ 1;
}

map $http_accept $springapex_avif_accepted {
    default 0;
    "~*image/avif[^,]*;\s*q\s*=\s*0(?:\.0*)?(?:\s*;|\s*,|\s*$)" 0;
    "~*image/avif(?:\s*;|\s*,|\s*$)" 1;
}

map $http_accept $springapex_webp_accepted {
    default 0;
    "~*image/webp[^,]*;\s*q\s*=\s*0(?:\.0*)?(?:\s*;|\s*,|\s*$)" 0;
    "~*image/webp(?:\s*;|\s*,|\s*$)" 1;
}

map "$springapex_original_image_requested:$springapex_avif_accepted" $springapex_avif_suffix {
    default "";
    "0:1" ".avif";
}

map "$springapex_original_image_requested:$springapex_webp_accepted" $springapex_webp_suffix {
    default "";
    "0:1" ".webp";
}

server {
    listen 80;
    listen [::]:80;
    server_name norenspring.com www.norenspring.com origin.norenspring.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/norenspring.com;
        allow all;
    }

    location / {
        return 301 https://www.norenspring.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name norenspring.com;

    ssl_certificate /www/server/panel/vhost/cert/norenspring.com/current/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/norenspring.com/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://www.norenspring.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.norenspring.com origin.norenspring.com;

    # Generated from AWS's CLOUDFRONT_ORIGIN_FACING ranges. This makes
    # REMOTE_ADDR the viewer address supplied by CloudFront, without trusting
    # the same header from arbitrary direct clients.
    include /www/server/panel/vhost/nginx/cloudfront-real-ip.conf;

    root /www/wwwroot/norenspring.com;
    index index.php index.html index.htm;
    client_max_body_size 12m;

    ssl_certificate /www/server/panel/vhost/cert/norenspring.com/current/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/norenspring.com/current/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NorenSpringSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /wp-content/uploads/springapex-private/ {
        access_log off;
        return 404;
    }

    location = /xmlrpc.php {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    include enable-php-83.conf;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    # Converter for Media stores generated files under uploads-webpc while
    # keeping the public image URL unchanged. Prefer AVIF, then WebP, and keep
    # the original as the final fallback for clients without format support.
    location ~* ^/wp-content/(?<springapex_image_path>.+)\.(?<springapex_image_ext>jpe?g|png|gif|webp)$ {
        try_files
            /wp-content/uploads-webpc/$springapex_image_path.$springapex_image_ext$springapex_avif_suffix
            /wp-content/uploads-webpc/$springapex_image_path.$springapex_image_ext$springapex_webp_suffix
            $uri
            =404;
        expires 1y;
        add_header Vary "Accept" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    access_log /www/wwwlogs/norenspring.com.log;
    error_log /www/wwwlogs/norenspring.com.error.log;
}
