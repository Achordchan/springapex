server {
    listen 80;
    listen [::]:80;
    server_name norenspring.com www.norenspring.com;

    location ^~ /.well-known/acme-challenge/ {
        root /www/wwwroot/norenspring.com;
        allow all;
    }

    location / {
        return 301 https://www.norenspring.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name norenspring.com;

    ssl_certificate /www/server/panel/vhost/cert/norenspring.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/norenspring.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;

    return 301 https://www.norenspring.com$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.norenspring.com;

    root /www/wwwroot/norenspring.com;
    index index.php index.html index.htm;
    client_max_body_size 12m;

    ssl_certificate /www/server/panel/vhost/cert/norenspring.com/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/norenspring.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:NorenSpringSSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ^~ /wp-content/uploads/springapex-private/ {
        access_log off;
        return 404;
    }

    location = /xmlrpc.php {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    include enable-php-83.conf;

    location ~ /\.(?!well-known(?:/|$)) {
        return 404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|gif|webp|avif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    access_log /www/wwwlogs/norenspring.com.log;
    error_log /www/wwwlogs/norenspring.com.error.log;
}
