name: Deploy NorenSpring to AWS BT Panel

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: springapex-production
  cancel-in-progress: false

jobs:
  verify:
    name: Verify production code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Lint theme PHP files
        run: |
          find wp-content/themes/springapex -name '*.php' -print0 \
            | xargs -0 -n1 -P4 php -l

      - name: Verify admin content coverage
        run: php wp-content/themes/springapex/tests/admin-content-coverage.php

      - name: Verify private S3 storage flow
        run: php wp-content/themes/springapex/tests/s3-storage.php

      - name: Require a new version for changed CDN assets
        if: github.event_name == 'push' && github.event.before != '0000000000000000000000000000000000000000'
        run: sh deploy/verify-asset-version-bump.sh "${{ github.event.before }}"

      - name: Check deployment shell syntax
        run: |
          sh -n deploy/springapex-deploy-command
          sh -n deploy/verify-asset-version-bump.sh
          sh -n deploy/springapex-backup-to-s3
          sh -n deploy/springapex-pull-production

      - name: Check theme JavaScript syntax
        run: |
          node --check wp-content/themes/springapex/assets/js/main.js
          node --check wp-content/themes/springapex/assets/js/product-compression.js
          node --check wp-content/themes/springapex/assets/js/row-editor.js

  release:
    name: Mark verified commit for production
    needs: verify
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    environment: production
    steps:
      - name: Advance the production-ready branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_HMAC_KEY: ${{ secrets.SPRINGAPEX_RELEASE_HMAC_KEY }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_HMAC_KEY"
          api="https://api.github.com/repos/$REPOSITORY/git/refs"
          headers=(
            -H "Authorization: Bearer $GH_TOKEN"
            -H "Accept: application/vnd.github+json"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )
          signature="$(printf '%s' "$RELEASE_SHA" \
            | openssl dgst -sha256 -hmac "$RELEASE_HMAC_KEY" -binary \
            | xxd -p -c 256)"
          tag="production-ready-$RELEASE_SHA-$signature"
          if tag_json="$(curl -fsS "${headers[@]}" "$api/tags/$tag" 2>/dev/null)"; then
            test "$(jq -r '.object.sha' <<<"$tag_json")" = "$RELEASE_SHA"
          else
            curl -fsS -X POST "${headers[@]}" \
              "$api" \
              -d "{\"ref\":\"refs/tags/$tag\",\"sha\":\"$RELEASE_SHA\"}" >/dev/null
          fi
          if curl -fsS "${headers[@]}" "$api/heads/production-ready" >/dev/null; then
            curl -fsS -X PATCH "${headers[@]}" \
              "$api/heads/production-ready" \
              -d "{\"sha\":\"$RELEASE_SHA\",\"force\":false}" >/dev/null
          else
            curl -fsS -X POST "${headers[@]}" \
              "$api" \
              -d "{\"ref\":\"refs/heads/production-ready\",\"sha\":\"$RELEASE_SHA\"}" >/dev/null
          fi
